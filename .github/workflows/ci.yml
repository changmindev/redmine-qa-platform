name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest -q
        env:
          # 테스트는 외부 호출을 전부 mock 한다. 실제 값을 넣지 않는다.
          REDMINE_URL: https://redmine.test
          REDMINE_API_KEY: test-key
          REDMINE_PROJECT_ID: test-project
          ANTHROPIC_API_KEY: ""
          LOG_LEVEL: CRITICAL

      - name: ruff
        run: ruff check .

      - name: DOM 계약 검사
        run: python tools/check_dom_contract.py
